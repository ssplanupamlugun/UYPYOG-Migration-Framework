spring.application.name=FinanceDataMigration
server.port=8000

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

finance.voucher.create-url=${FINANCE_VOUCHER_CREATE_URL:http://localhost:9090/services/EGF/rest/voucher/_create}

# Finance Base URL
finance.base-url=https://finance.ulbharyana.gov.in/

# OAuth Token API
finance.auth.token-url=${finance.base-url}user/oauth/token

# OAuth Authorization Header
finance.auth.authorization-key=Basic ZWdvdi11c2VyLWNsaWVudDo=

# System Integration User
finance.auth.username=SIFINANCE
finance.auth.password=eGov@4321

# OAuth Parameters
finance.auth.grant-type=password
finance.auth.scope=read

# Tenant
finance.tenant=hr.gurugram

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/upyog_migration}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernate Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB